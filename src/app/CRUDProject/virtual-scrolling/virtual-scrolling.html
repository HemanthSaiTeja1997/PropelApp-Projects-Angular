<div class="box">
  <div class="search-box">
  <input
    type="text"
    placeholder="Search by name or first letter"
    [(ngModel)]="searchTerm"
  />
</div>
<cdk-virtual-scroll-viewport itemSize="50" class="viewport">
  <table class="tablebox">
    <thead>
      <tr>
        <th>Id</th>
        <th>Name</th>
        <th>UserName</th>
        <th>Email</th>
        <th>update</th>
        <th>View</th>
        <th>Delete</th>
      </tr>
    </thead>
    <tbody>
      <tr
        *cdkVirtualFor="
          let user of UserData
          | searchUserPipe : searchTerm
        
        "
      >
        <td>{{ user.id }}</td>
        <td>{{ user.name }}</td>
        <td>{{ user.username }}</td>
        <td>{{ user.email }}</td>
        <td>
          <button class="btn-update" (click)="updateUser(user.id)">
            Update
          </button>
        </td>
        <td>
          <button class="btn-view" (click)="onview(user.id)">View</button>
        </td>
        <td>
          <button class="btn-delete" (click)="ondelete(user.id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
  </cdk-virtual-scroll-viewport>
  <div>
    <button class="btn" (click)="addNewUser()">Add New User</button>
  </div>
</div>
