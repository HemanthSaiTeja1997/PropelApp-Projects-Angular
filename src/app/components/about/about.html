<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  </head>
  <body>
    <h1>Hello, world!</h1>
    <p>About Hemanth : {{abouthemanth}}</p>
<div>
    <p>Property Binding </p>
    <input type="text" [value]="propertyBindingValue"/>
    <div style="height: 160px; width: 250px; border: 1px solid black;">
        <img [src]="image" alt="image is rendered using property binding ">
    </div>
    <div>
        <p>Event Binding</p>
        <button class="btn btn-primary" style="border-radius: 6cm;" (click)="onSave()">Event-Binding</button>
        <button type="button" class="btn btn-primary">Primary</button>
    </div>
    <div>
        <h2>Two Way Data Binding</h2>
        <input type="text" [(ngModel)]="random">
        {{random}}
    </div>
</div>
  </body>
</html>
